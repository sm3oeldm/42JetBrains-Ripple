<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ripple: concentric rings spreading from a single point of impact.
       One accent colour, no gradients — reads cleanly at 16px in the
       Marketplace list and in the Plugins settings pane. -->
  <circle cx="20" cy="20" r="16.5" stroke="#3574F0" stroke-width="1.25" opacity="0.30"/>
  <circle cx="20" cy="20" r="11.5" stroke="#3574F0" stroke-width="1.5"  opacity="0.55"/>
  <circle cx="20" cy="20" r="6.5"  stroke="#3574F0" stroke-width="1.75" opacity="0.80"/>
  <circle cx="20" cy="20" r="2.5"  fill="#3574F0"/>
</svg>
